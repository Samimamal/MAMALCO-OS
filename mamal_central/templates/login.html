{% extends "base.html" %}
{% block title %}ورود — MAMAL Central{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>ورود</h1>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>نام کاربری
      <input name="username" autocomplete="username" dir="ltr" required autofocus>
    </label>
    <label>رمز عبور
      <input name="password" type="password" autocomplete="current-password" dir="ltr" required>
    </label>
    <button type="submit" class="primary">ورود</button>
  </form>
</section>
{% endblock %}
